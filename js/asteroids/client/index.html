<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Space Game</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="lobby" class="lobby-container">
    <h1>Select a Room</h1>
    <div id="room-list"></div>
    <input type="text" id="player-name" placeholder="Enter your name" />
    <button id="join-btn">Join</button>
  </div>

  <div id="game-container" style="position: relative;">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    
    <div id="netgraph" style="position: absolute; top: 10px; right: 10px; background: rgba(0,20,0,0.8); color: #0f0; font-family: monospace; font-size: 14px; padding: 10px; pointer-events: none; z-index: 10; display: none;">
      <b>NETGRAPH</b>
      <div>RTT: <span id="ng-rtt">0</span> ms</div>
      <div>Age: <span id="ng-age">0</span> ms</div>
      <div>Bytes/s: <span id="ng-bps">0</span></div>
      <div>In Queue: <span id="ng-queue">0</span></div>
      <div>Pos Error: <span id="ng-err">0</span> px</div>
    </div>

    <div id="error-overlay" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,0,0,0.8); color: white; padding: 20px;">
      <h2 id="error-message">Error</h2>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
